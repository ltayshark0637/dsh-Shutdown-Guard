.dsp-card[data-state="blocked"] .dsp-live{background:var(--dsp-blocked);box-shadow:0 0 0 3px var(--dsp-blocked-soft);animation:none}
.dsp-card[data-state="blocked"] .dsp-tag{color:var(--dsp-blocked);border-color:var(--dsp-blocked-soft);background:var(--dsp-blocked-soft)}
.dsp-card[data-state="blocked"] .dsp-big{color:var(--dsp-blocked)}
.dsp-card[data-state="blocked"] .dsp-btn{color:var(--dsp-fg);border-color:color-mix(in srgb,var(--dsp-blocked) 55%,transparent);background:var(--dsp-blocked-soft)}
.dsp-card[data-state="blocked"] .dsp-hazard{opacity:.28;filter:grayscale(1)}
.dsp-card[data-state="blocked"] .dsp-hazard::before{animation-play-state:paused}
.dsp-card[data-state="blocked"] .dsp-rings{opacity:.30;filter:grayscale(1)}
.dsp-card[data-state="blocked"] .dsp-sweep{display:none}
.dsp-card[data-state="blocked"] .dsp-ping{display:none}
.dsp-card[data-state="blocked"] .dsp-dot{opacity:.22}
.dsp-card[data-state="blocked"] .dsp-hud b{color:var(--dsp-blocked)}
.dsp-card[data-state="blocked"] .dsp-hud::before{background:var(--dsp-blocked);box-shadow:none}
.dsp-card[data-state="blocked"] .dsp-screen{background:color-mix(in srgb,var(--dsp-blocked) 10%,#0b0d10);border-color:color-mix(in srgb,var(--dsp-blocked) 40%,transparent);color:#c3cbdc}
.dsp-card[data-state="blocked"] .dsp-pr{color:var(--dsp-blocked)}
.dsp-card[data-state="blocked"] .dsp-led-seg.on{background:var(--dsp-blocked)}
.dsp-card[data-state="blocked"] .dsp-code{color:var(--dsp-blocked)}

/* waiting: something outside is recovering, the plugin keeps retrying */
.dsp-card[data-level="waiting"]{--dsp-blocked:#6f8f7a;--dsp-blocked-soft:rgba(111,143,122,.16)}
.dsp-card[data-lum="light"][data-level="waiting"]{--dsp-blocked:#4a7059;--dsp-blocked-soft:rgba(74,112,89,.12)}
.dsp-card[data-level="waiting"] .dsp-live{animation:dsp-wait 1.6s ease-in-out infinite}
@keyframes dsp-wait{0%,100%{opacity:.45;box-shadow:0 0 0 2px var(--dsp-blocked-soft)}50%{opacity:1;box-shadow:0 0 0 5px transparent}}

/* stuck: no progress for a while, a human has to judge */
.dsp-card[data-level="stuck"]{--dsp-blocked:#8a7391;--dsp-blocked-soft:rgba(138,115,145,.16)}
.dsp-card[data-lum="light"][data-level="stuck"]{--dsp-blocked:#6b5473;--dsp-blocked-soft:rgba(107,84,115,.12)}
.dsp-card[data-level="stuck"] .dsp-live{animation:none}
.dsp-card[data-level="stuck"] .dsp-hazard{opacity:.5;filter:grayscale(.6)}

.dsp-ev-blocked .dsp-ev-time{color:var(--dsp-blocked,#7e8aa3)}

</style></head><body>
<div class="app">
  <div class="list" id="list"></div>
  <div class="stage">
    <div class="col">
      <div class="explain" id="explain"></div>
      <div class="segs" id="segs">
        <button data-v="A" class="on">A</button><button data-v="B">B</button><button data-v="C">C</button>
        <button data-m="fold">折叠</button><button data-m="light">浅色</button>
      </div>
      <div id="card"></div>
      <div id="card2"></div>
    </div>
    <div class="panel"><div id="settings"></div></div>
  </div>
</div>
<script>
const STATES = [{"key":"quota","level":"halted","code":"QUOTA","name":"额度不足","big":"已暂停","meta":"额度不足，充值后解除再武装","btn":"解除并重试","why":"账户余额或配额耗尽。重试没有意义，充值后解除再武装即可恢复。"},{"key":"account-quota","level":"halted","code":"ACCOUNT_QUOTA","name":"账户额度用尽","big":"已暂停","meta":"账户额度用尽，充值后解除再武装","btn":"解除并重试","why":"账户级 token 配额耗尽，需要在账户页补充。"},{"key":"invalid-credential","level":"halted","code":"INVALID_CREDENTIAL","name":"凭证无效","big":"已暂停","meta":"凭证无效，修复后解除再武装","btn":"解除并重试","why":"密钥是非法的（不是缺失）。每次请求都会得到同样的拒绝，重试无意义。"},{"key":"missing-credential","level":"halted","code":"MISSING_CREDENTIAL","name":"缺少凭证","big":"已暂停","meta":"缺少凭证，配置后解除再武装","btn":"解除并重试","why":"没有配置密钥。属于配置问题，不是运行时故障。"},{"key":"context","level":"halted","code":"CONTEXT_WINDOW_EXCEEDED","name":"上下文超限","big":"已暂停","meta":"上下文已超出模型窗口，建议新开会话","btn":"解除并重试","why":"压缩也无法腾出空间。继续注入只会立刻再次超限，收尾报告也写不完。"},{"key":"capability","level":"halted","code":"CAPABILITY_UNSUPPORTED","name":"模型不支持该能力","big":"已暂停","meta":"当前模型不支持这项操作，换模型后再试","btn":"解除并重试","why":"例如要求读图但模型没有视觉能力。换模型才有效，重试不会变好。"},{"key":"disk","level":"halted","code":"DISK_FULL","name":"写入失败","big":"已暂停","meta":"写盘失败，清理空间后解除再武装","btn":"解除并重试","why":"「收尾落盘」本身就会失败，等于恢复流程不可用，必须人工处理。"},{"key":"rate-limit","level":"waiting","code":"RATE_LIMIT","name":"持续限流","big":"等待恢复","meta":"被限流，30 秒后自动重试（第 3 次）","btn":"解除","why":"服务是好的，只是暂时拒绝。自动退避重试，恢复后照常继续，不需要人。"},{"key":"server","level":"waiting","code":"SERVER","name":"服务端故障","big":"等待恢复","meta":"服务端 5xx，30 秒后自动重试（第 2 次）","btn":"解除","why":"对方故障，通常几分钟内自愈。等待比重试更省额度。"},{"key":"transport","level":"waiting","code":"TRANSPORT","name":"网络中断","big":"等待恢复","meta":"连接中断，30 秒后自动重试（第 1 次）","btn":"解除","why":"本地网络或代理问题。恢复后自动继续。"},{"key":"empty","level":"waiting","code":"EMPTY_RESPONSE","name":"空响应重试耗尽","big":"等待恢复","meta":"模型返回了空内容，30 秒后重试","btn":"解除","why":"供应商偶发的退化补全，重试策略本身会处理，只是这次用完了次数。"},{"key":"approval","level":"stuck","code":"—","name":"审批无人应答","big":"疑似卡住","meta":"等待审批已 12 分钟，没有新进展","btn":"强制关机","why":"工具审批等了太久。会话仍是 running，但已经不产生任何事件。"},{"key":"job-stop","level":"stuck","code":"—","name":"后台任务卡在 stopping","big":"疑似卡住","meta":"1 个后台任务停止中已 8 分钟","btn":"强制关机","why":"job 一直报 stopping 而不是 settled，插件会永远算它「在跑」。"},{"key":"frozen","level":"stuck","code":"—","name":"会话状态不刷新","big":"疑似卡住","meta":"会话状态 15 分钟没有变化","btn":"强制关机","why":"agent 已经死了但 status 没翻到 idle，关机条件永远不满足。"},{"key":"off","level":"normal","state":"off","name":"未开启（对照）"},{"key":"armed","level":"normal","state":"armed","name":"待命（对照）"},{"key":"hold","level":"normal","state":"hold","name":"等待后台任务（对照）"},{"key":"fire","level":"normal","state":"fire","name":"倒计时（对照）"}];
const LEVEL_LABEL = {"halted":"停住 · 只有人能解除","waiting":"等待 · 会自动恢复","stuck":"疑似卡住 · 需人判断","normal":"对照 · 正常运行"};
const DOTS = "<i class=\"dsp-dot dsp-dot-job\" style=\"left:38%;top:34%\"></i><i class=\"dsp-dot dsp-dot-job\" style=\"left:64%;top:62%\"></i><i class=\"dsp-dot dsp-dot-run\" style=\"left:52%;top:72%\"></i><i class=\"dsp-dot dsp-dot-run\" style=\"left:30%;top:58%\"></i>";
const RING = "<circle cx=\"119\" cy=\"101\" r=\"23\" fill=\"none\" stroke=\"var(--dsp-accent)\" stroke-width=\"1\" stroke-opacity=\"0.42\"></circle><circle cx=\"119\" cy=\"101\" r=\"35\" fill=\"none\" stroke=\"var(--dsp-accent)\" stroke-width=\"1\" stroke-opacity=\"0.39\"></circle><circle cx=\"119\" cy=\"101\" r=\"47\" fill=\"none\" stroke=\"var(--dsp-accent)\" stroke-width=\"1\" stroke-opacity=\"0.36\"></circle><circle cx=\"119\" cy=\"101\" r=\"59\" fill=\"none\" stroke=\"var(--dsp-accent)\" stroke-width=\"1\" stroke-opacity=\"0.32\"></circle><circle cx=\"119\" cy=\"101\" r=\"71\" fill=\"none\" stroke=\"var(--dsp-accent)\" stroke-width=\"1\" stroke-opacity=\"0.29\"></circle><circle cx=\"119\" cy=\"101\" r=\"83\" fill=\"none\" stroke=\"var(--dsp-accent)\" stroke-width=\"1\" stroke-opacity=\"0.26\"></circle><circle cx=\"119\" cy=\"101\" r=\"95\" fill=\"none\" stroke=\"var(--dsp-accent)\" stroke-width=\"1\" stroke-opacity=\"0.23\"></circle><circle cx=\"119\" cy=\"101\" r=\"107\" fill=\"none\" stroke=\"var(--dsp-accent)\" stroke-width=\"1\" stroke-opacity=\"0.20\"></circle><circle cx=\"119\" cy=\"101\" r=\"119\" fill=\"none\" stroke=\"var(--dsp-accent)\" stroke-width=\"1\" stroke-opacity=\"0.16\"></circle>";
let cur = 'quota', variant = 'A', folded = false, light = false;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function isBlocked(it){return it.level==='halted'||it.level==='waiting'||it.level==='stuck'}

function bodyHtml(item, variant){
  const blocked = isBlocked(item);
  if(variant==='B'){
    const hud = blocked
      ? '<b>'+(item.level==='waiting'?'Retrying':'Paused')+'</b><span>'+esc(item.name)+'</span>'
      : item.state==='hold' ? '<b>Holding</b><span>jobs 2 · agent 3</span>'
      : item.state==='fire' ? '<b>00:42</b><span>T-minus</span>'
      : '<b>Standby</b><span>jobs 0 · agent 1</span>';
    return '<div class="dsp-cbody dsp-v-b"><div class="dsp-disc"><div class="dsp-sweep"></div>'
      +'<div class="dsp-rings"><svg class="dsp-radar-svg" viewBox="0 0 238 202">'+RING+'</svg></div>'
      +'<div class="dsp-ping"></div><div class="dsp-dots">'+DOTS+'</div>'
      +'<div class="dsp-hud">'+hud+'</div></div></div>';
  }
  if(variant==='C'){
    const lines = blocked
      ? '<div class="dsp-term-line"><span class="dsp-pr">&gt;</span>shutdown --when idle</div>'
      +'<div class="dsp-term-line"><span class="dsp-pr">&gt;</span><span style="color:var(--dsp-blocked)">error '+esc(item.code)+'</span></div>'
      +'<div class="dsp-term-line"><span class="dsp-pr">&gt;</span><span style="color:var(--dsp-blocked)">shutdown '+(item.level==='waiting'?'retrying':'halted')+'</span><i class="dsp-caret"></i></div>'
      : '<div class="dsp-term-line"><span class="dsp-pr">&gt;</span>shutdown --when idle</div>'
      +'<div class="dsp-term-line"><span class="dsp-pr">&gt;</span><span class="dsp-l2">'+(item.state==='fire'?'countdown 42s':'waiting holders')+'</span></div>'
      +'<div class="dsp-term-line"><span class="dsp-pr">&gt;</span><span class="dsp-l3"></span><i class="dsp-caret"></i></div>';
    const on = blocked?3:4;
    let led=''; for(let i=0;i<6;i++) led+='<i class="dsp-led-seg'+(i<on?' on':'')+'" data-i="'+i+'"></i>';
    return '<div class="dsp-cbody dsp-v-c"><div class="dsp-screen">'+lines+'</div><div class="dsp-led">'+led+'</div>'
      +'<div class="dsp-code">'+(blocked?(item.level==='waiting'?'waiting · 自动重试':'halted · 需人工处理'):'agent 3 · running')+'</div></div>';
  }
  const big = blocked ? item.big : ({off:'未开启',armed:'待命',hold:'等待后台任务',fire:'00:42'})[item.state];
  const meta = blocked ? item.meta : ({
    off:'仅在点击「武装」后才会运行程序',
    armed:'所有任务已结束 · 等待下一次触发',
    hold:'2 个后台任务 · 3 个会话，完成后关机',
    fire:'系统关机指令已下发'})[item.state];
  return '<div class="dsp-cbody dsp-v-a"><div class="dsp-big">'+esc(big)+'</div><div class="dsp-meta">'+esc(meta)+'</div></div>';
}

function cardHtml(item, variant, folded, light){
  const blocked = isBlocked(item);
  const tag = blocked ? (item.level==='waiting'?'RETRY':item.level==='stuck'?'STUCK':'PAUSED')
    : ({off:'OFF',armed:'ARMED',hold:'WAIT',fire:'FIRE'})[item.state];
  const dataState = blocked ? 'blocked' : item.state;
  const lum = light ? 'light' : 'dark';
  let inner='';
  if(!folded){
    let btn;
    if(!blocked) btn = item.state==='off' ? '<button class="dsp-btn dsp-btn-primary">武装</button>'
      : '<button class="dsp-btn dsp-btn-danger">'+(item.state==='fire'?'取消关机':'解除')+'</button>';
    else if(item.level==='waiting') btn='<button class="dsp-btn">解除</button>';
    else btn='<button class="dsp-btn">'+esc(item.btn)+'</button>';
    inner = bodyHtml(item,variant)+'<div class="dsp-cbtns">'+btn+'</div><div class="dsp-hazard"></div>';
  }
  return '<div class="dsp-card'+(folded?' is-folded':'')+'" data-state="'+dataState+'" data-variant="'+variant+'" data-lum="'+lum+'"'
    +(blocked?' data-level="'+item.level+'"':'')+'>'
    +'<div class="dsp-chead"><i class="dsp-live"></i><span class="dsp-ctitle">任务完成后关机</span><span class="dsp-tag">'+tag+'</span>'
    +'<svg class="dsp-chev'+(folded?' is-folded':'')+'" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'
    +'</div>'+inner+'</div>';
}

function settingsHtml(item){
  const blocked = isBlocked(item);
  const now = blocked ? esc(item.big+'：'+item.name) : '无';
  const evs = blocked
    ? [['12:00:31', 'blocked', '会话 root-1 的错误：'+item.code+' → '+item.meta],
       ['11:58:02','skip','还有 2 个后台任务在运行，暂不关机（模式保持开启）'],
       ['11:57:40','info','已开启：任务完成后自动关机']]
    : [['12:02:55','skip','还有 2 个后台任务在运行，暂不关机（模式保持开启）'],
       ['12:02:31','info','已开启：任务完成后自动关机']];
  const evlog = '<div class="dsp-evlog">'+evs.map(e=>'<div class="dsp-ev dsp-ev-'+e[1]+'"><span class="dsp-ev-time">'+e[0]+'</span><span class="dsp-ev-text">'+esc(e[2])+'</span></div>').join('')+'</div>';
  const color = blocked ? 'var(--dsp-blocked)' : 'inherit';
  return '<div class="dsp-settings"><div class="dsp-sgroup-box"><div class="dsp-sgroup">状态</div>'
    +'<div class="dsp-srow"><div class="dsp-srow-text"><span class="dsp-stitle">当前阻断</span>'
    +'<span class="dsp-sdesc">'+(blocked?'阻断期间不会下发关机指令。':'没有阻断，条件满足就会正常倒计时。')+'</span></div>'
    +'<span class="dsp-sval" style="color:'+color+';max-width:300px;text-align:right">'+now+'</span></div>'
    +'<div class="dsp-srow dsp-srow-stack"><div class="dsp-srow-text"><span class="dsp-stitle">上次为什么没关机</span></div>'
    +'<span class="dsp-sval'+(blocked?'':' dsp-sval-dim')+'">'+(blocked?esc(item.meta):'还没发生过')+'</span></div>'
    +'<div class="dsp-srow dsp-srow-stack"><div class="dsp-srow-text"><span class="dsp-stitle">事件日志</span>'
    +'<span class="dsp-sdesc">'+(blocked?'最近 '+evs.length+' 条':'暂无阻断记录')+'，完整记录在插件 data/events.log。</span></div>'+evlog+'</div>'
    +'</div></div>';
}

function renderList(){
  const order=['halted','waiting','stuck','normal'];
  const cls={halted:'dot-h',waiting:'dot-w',stuck:'dot-s',normal:'dot-n'};
  let html='';
  for(const lv of order){
    html+='<div class="lg">'+LEVEL_LABEL[lv]+'</div>';
    for(const it of STATES.filter(s=>s.level===lv)){
      html+='<div class="item'+(it.key===cur?' on':'')+'" data-k="'+it.key+'">'
        +'<i class="'+cls[lv]+'"></i><div><div class="nm">'+esc(it.name)+'</div>'
        +'<div class="cd">'+esc(it.code)+'</div></div></div>';
    }
  }
  document.getElementById('list').innerHTML=html;
  document.querySelectorAll('.item').forEach(el=>el.onclick=()=>{cur=el.dataset.k;renderAll()});
}

function renderAll(){
  const item=STATES.find(s=>s.key===cur);
  renderList();
  document.getElementById('card').innerHTML=cardHtml(item,variant,false,light);
  document.getElementById('card2').innerHTML=light?'':cardHtml(item,variant,true,false);
  document.getElementById('settings').innerHTML=settingsHtml(item);
  document.getElementById('explain').innerHTML='<b>'+esc(item.name)+'</b>'
    +(item.code&&item.code!=='—'?' <code style="font-size:11.5px;color:#8b887e">'+esc(item.code)+'</code>':'')
    +'<br>'+(item.why?esc(item.why):'正常运行状态，用于对照。');
  document.querySelectorAll('#segs button').forEach(b=>{
    if(b.dataset.v) b.classList.toggle('on',b.dataset.v===variant);
    if(b.dataset.m==='fold') b.classList.toggle('on',folded);
    if(b.dataset.m==='light') b.classList.toggle('on',light);
  });
}

document.querySelectorAll('#segs button').forEach(b=>{
  b.onclick=()=>{
    if(b.dataset.v) variant=b.dataset.v;
    if(b.dataset.m==='fold') folded=!folded;
    if(b.dataset.m==='light') light=!light;
    renderAll();
  };
});
renderAll();
</script></body></html>
