<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh-shutdown-panel · 完整交互原型</title>
<style>
  :root{
    --bg:#0b0d11; --panel:#15181e; --panel-2:#1b1f27; --line:#2a3040; --line-soft:#222733;
    --text:#e9ecf3; --muted:#8d97a8; --dim:#5c6678;
    --amber:#ffb224; --red:#ff4d4f; --yellow:#ffd23f; --green:#63d68b;
    --shadow:0 18px 40px -22px rgba(0,0,0,.9);
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  body[data-theme="light"]{
    --bg:#eef0f4; --panel:#ffffff; --panel-2:#f3f5f9; --line:#dde2ec; --line-soft:#e8ecf3;
    --text:#1b2030; --muted:#5f6b80; --dim:#8b95a8; --shadow:0 18px 40px -24px rgba(20,30,60,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}
  .wrap{display:flex;gap:28px;padding:26px;align-items:flex-start;max-width:1120px;margin:0 auto}
  .col-side{flex:none}
  .col-side .hint{font-size:11px;color:var(--dim);margin:10px 2px 0;line-height:1.7}

  /* ---------------- sidebar ---------------- */
  .sidebar{width:252px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:10px 8px;display:flex;flex-direction:column;min-height:660px;box-shadow:var(--shadow);
    transition:width .22s ease}
  .brand{display:flex;align-items:center;gap:8px;padding:6px 8px 10px;overflow:hidden}
  .brand .mark{width:20px;height:20px;border-radius:7px;background:linear-gradient(145deg,#5b8cff,#8b5cf6);flex:none}
  .brand b{font-size:13px;font-weight:650;white-space:nowrap}
  .newbtn{display:flex;align-items:center;gap:8px;margin:0 2px 8px;padding:8px;border-radius:9px;background:var(--panel-2);
    border:1px solid var(--line);color:var(--text);font-size:12.5px;white-space:nowrap;overflow:hidden}
  .newbtn kbd{margin-left:auto;color:var(--dim);font-size:10px;font-family:var(--mono)}
  .navrow{position:relative;display:flex;align-items:center;gap:9px;margin:0 2px 2px;padding:7px 9px;border-radius:9px;
    color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden}
  .navrow.on{background:var(--panel-2);color:var(--text)}
  .navrow svg{flex:none;opacity:.85}
  .navrow .armdot{display:none;width:6px;height:6px;border-radius:50%;background:var(--amber);flex:none;margin-left:auto}
  .sidebar.armed .navrow .armdot{display:block;animation:pulse 1.8s infinite}
  .navrow .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis}

  .region{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;margin-top:6px;overflow:hidden;padding:0 2px 4px}
  .seclabel{font-size:10.5px;color:var(--dim);letter-spacing:.08em;padding:4px 7px 0;white-space:nowrap}
  .sess{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:7px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden}
  .sess i{width:5px;height:5px;border-radius:50%;background:var(--dim);flex:none}
  .sess.act{background:var(--panel-2);color:var(--text)}
  .spacer{flex:1}

  /* ---------------- card ---------------- */
  .card{position:relative;flex:none;border-radius:16px;overflow:visible;background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);padding:12px 12px 0;transition:border-color .35s,box-shadow .35s}
  .card[data-state="armed"],.card[data-state="idle"]{border-color:rgba(255,178,36,.55);box-shadow:0 0 0 1px rgba(255,178,36,.10),0 12px 30px -20px rgba(255,178,36,.85)}
  .card[data-state="hold"]{border-color:rgba(255,178,36,.26);box-shadow:none}
  .card[data-state="fire"]{border-color:rgba(255,77,79,.62);box-shadow:0 0 0 1px rgba(255,77,79,.14),0 14px 36px -20px rgba(255,77,79,.9)}
  .card[data-state="fired"]{border-color:rgba(255,77,79,.32);box-shadow:none}
  .card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .4s;
    background:radial-gradient(120% 78% at 50% -26%, rgba(255,178,36,.16), transparent 62%);z-index:0}
  .card[data-state="armed"]::before,.card[data-state="idle"]::before,.card[data-state="hold"]::before{opacity:1}
  .card[data-state="fire"]::before{opacity:1;background:radial-gradient(120% 78% at 50% -26%, rgba(255,77,79,.2), transparent 62%)}
  .card>*{position:relative;z-index:1}
  .card .hazard{position:relative;z-index:0;margin:0 -12px}

  .chead{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);white-space:nowrap}
  .chead .live{width:6px;height:6px;border-radius:50%;background:var(--dim);flex:none}
  .card[data-state="armed"] .chead .live,.card[data-state="idle"] .chead .live{background:var(--amber);animation:pulse 1.8s infinite}
  .card[data-state="hold"] .chead .live{background:var(--amber);opacity:.55;animation:pulse 3.4s infinite}
  .card[data-state="fire"] .chead .live{background:var(--red);animation:pulse .9s infinite}
  .card[data-state="fired"] .chead .live{background:var(--red);opacity:.5}
  .tag{margin-left:auto;font-size:9px;letter-spacing:.12em;font-family:var(--mono);padding:2px 6px;border-radius:5px;
    color:var(--dim);border:1px solid var(--line)}
  .card[data-state="armed"] .tag,.card[data-state="idle"] .tag{color:var(--amber);border-color:rgba(255,178,36,.45);background:rgba(255,178,36,.08)}
  .card[data-state="hold"] .tag{color:var(--amber);opacity:.8;border-color:rgba(255,178,36,.28)}
  .card[data-state="fire"] .tag{color:var(--red);border-color:rgba(255,77,79,.5);background:rgba(255,77,79,.09)}
  .card[data-state="fired"] .tag{color:var(--red);opacity:.6;border-color:rgba(255,77,79,.3)}

  .cbody{padding:9px 0 11px;min-height:64px}
  .big{font-family:var(--mono);font-size:25px;line-height:1.08;font-weight:600;letter-spacing:-.02em}
  .big small{font-size:11px;color:var(--muted);font-weight:400;margin-left:6px;letter-spacing:0}
  .card[data-state="fire"] .big{color:#ffdadb;text-shadow:0 0 20px rgba(255,77,79,.45)}
  .card[data-state="fired"] .big{color:#ffb4b5;font-size:21px}
  .card[data-state="hold"] .big{font-size:18px;letter-spacing:0}
  .meta{display:flex;gap:9px;margin-top:7px;font-size:10.5px;color:var(--muted);flex-wrap:wrap}
  .meta b{color:var(--text);font-weight:600;font-family:var(--mono);font-size:10.5px}
  .meta .warn{color:var(--yellow)}

  .cbtns{display:flex;gap:6px;padding-bottom:11px}
  .btn{flex:1;height:27px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);
    font:inherit;font-size:11.5px;cursor:pointer;transition:.15s}
  .btn:hover{filter:brightness(1.14)}
  .btn:active{transform:translateY(.5px)}
  .btn.primary{background:linear-gradient(180deg,#ffc247,#ffa414);border-color:#ffb224;color:#2a1c00;font-weight:650}
  .btn.danger{border-color:rgba(255,77,79,.42);color:#ffb4b5;background:rgba(255,77,79,.08)}
  .btn.ghost{flex:0 0 34px;display:grid;place-items:center;color:var(--muted)}

  .hazard{height:10px;overflow:hidden;opacity:.3;transition:opacity .4s,filter .4s;border-radius:0 0 15px 15px;
    background:repeating-linear-gradient(-45deg,var(--red) 0 10px,var(--red) 10px 12px,var(--yellow) 12px 22px,var(--yellow) 22px 24px);
    background-size:34px 34px;animation:slide 1.15s linear infinite}
  .card[data-state="armed"] .hazard,.card[data-state="idle"] .hazard{opacity:.95}
  .card[data-state="hold"] .hazard{opacity:.5;animation-duration:2.2s;filter:saturate(.65) brightness(.85)}
  .card[data-state="fire"] .hazard{opacity:1;animation-duration:.42s;filter:saturate(1.15)}
  .card[data-state="fired"] .hazard{opacity:.85;animation-duration:2.6s;filter:saturate(.5) brightness(.7)}
  .card.endgame .hazard{animation-duration:.26s}
  .hazard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.32),transparent 46%,rgba(0,0,0,.22))}
  .hazard{position:relative}
  .card.endgame{animation:breathe 1s ease-in-out infinite}

  .flash{position:absolute;inset:0;pointer-events:none;opacity:0;border-radius:inherit}
  .flash.play{animation:sweep 720ms cubic-bezier(.2,.7,.3,1) 1;
    background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.16) 46%,rgba(255,178,36,.45) 50%,rgba(255,255,255,.14) 54%,transparent 70%);
    background-size:260% 100%;background-position:120% 0}

  /* variants */
  .v-b,.v-c{display:none}
  .card[data-variant="B"] .v-a,.card[data-variant="C"] .v-a{display:none}
  .card[data-variant="B"] .v-b{display:block}
  .card[data-variant="C"] .v-c{display:block}
  .disc{position:relative;height:70px;margin:2px 0 6px;border-radius:10px;border:1px solid var(--line);overflow:hidden;
    display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,rgba(255,178,36,.08),transparent 64%),var(--panel-2)}
  .card[data-variant="B"][data-state="fire"] .disc{background:radial-gradient(circle at 50% 50%,rgba(255,77,79,.12),transparent 64%),var(--panel-2)}
  .sweep{position:absolute;left:50%;top:50%;width:180px;height:180px;margin:-90px 0 0 -90px;border-radius:50%;
    background:conic-gradient(from 0deg,rgba(255,178,36,0) 0deg,rgba(255,178,36,.10) 14deg,rgba(255,178,36,.62) 30deg,rgba(255,178,36,0) 44deg);
    animation:spin 2.6s linear infinite}
  .card[data-variant="B"][data-state="hold"] .sweep{animation-duration:5.2s;opacity:.55}
  .card[data-variant="B"][data-state="fire"] .sweep{animation-duration:.85s;
    background:conic-gradient(from 0deg,rgba(255,77,79,0) 0deg,rgba(255,77,79,.12) 14deg,rgba(255,77,79,.66) 30deg,rgba(255,77,79,0) 44deg)}
  .ring{position:absolute;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,178,36,.3);z-index:1}
  .ring.b{width:70px;height:70px;opacity:.45}
  .ping{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--amber);z-index:2;box-shadow:0 0 12px rgba(255,178,36,.9)}
  .card[data-variant="B"][data-state="fire"] .ping{background:var(--red);box-shadow:0 0 12px rgba(255,77,79,.9)}
  .num{position:relative;z-index:2;font-family:var(--mono);font-size:15px;color:var(--text);opacity:.92}
  .num small{font-size:10px;color:var(--muted);margin-left:4px}

  .screen{background:#0a0c10;border:1px solid var(--line);border-radius:9px;padding:8px 9px;margin:2px 0 6px;
    font-family:var(--mono);font-size:10.5px;line-height:1.6;color:#9ef0a8;position:relative;overflow:hidden}
  .screen::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
  .screen .cl{color:#4c6a55}
  .screen .cur{display:inline-block;width:5px;height:10px;background:#9ef0a8;vertical-align:-1px;animation:blink 1s steps(1) infinite}
  .card[data-variant="C"][data-state="fire"] .screen{color:#ff9fa1;border-color:rgba(255,77,79,.35)}
  .card[data-variant="C"][data-state="fire"] .screen .cl{color:#6d4448}
  .card[data-variant="C"][data-state="fire"] .screen .cur{background:#ff9fa1}
  .leds{display:flex;gap:4px;margin-bottom:8px}
  .leds i{height:4px;flex:1;border-radius:2px;background:var(--line)}
  .card[data-state="armed"] .leds i:nth-child(-n+3),.card[data-state="idle"] .leds i:nth-child(-n+3){background:var(--amber);box-shadow:0 0 8px rgba(255,178,36,.55)}
  .card[data-state="fire"] .leds i:nth-child(-n+4){background:var(--red);box-shadow:0 0 8px rgba(255,77,79,.6)}
  .card[data-state="hold"] .leds i:nth-child(-n+2){background:var(--amber);opacity:.6}
  .card[data-state="fired"] .leds i{background:#5a2a2b}

  .tip{position:absolute;left:8px;right:8px;top:calc(100% + 6px);z-index:9;opacity:0;transform:translateY(-4px);pointer-events:none;
    transition:opacity .16s,transform .16s;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 16px 36px -18px rgba(0,0,0,.9);padding:9px 10px;font-size:10.5px;color:var(--muted);line-height:1.6}
  .card:hover .tip,.card.tipOn .tip{opacity:1;transform:translateY(0)}
  .tip b{color:var(--text);font-weight:600}
  .tip .row2{margin-top:3px}
  .tip .k{color:var(--dim);font-family:var(--mono);font-size:9.5px;letter-spacing:.04em}

  /* collapsed */
  .sidebar.collapsed{width:58px;padding:8px 6px}
  .sidebar.collapsed .brand{padding:8px;justify-content:center}
  .sidebar.collapsed .brand b,.sidebar.collapsed .newbtn span,.sidebar.collapsed .newbtn kbd,
  .sidebar.collapsed .navrow .lbl,.sidebar.collapsed .seclabel,.sidebar.collapsed .sess,
  .sidebar.collapsed .other-plugin .op-body,.sidebar.collapsed .other-plugin .op-head span{display:none}
  .sidebar.collapsed .newbtn{justify-content:center;padding:9px 0}
  .sidebar.collapsed .navrow{justify-content:center;padding:9px 0}
  .sidebar.collapsed .navrow .armdot{position:absolute;top:6px;right:8px;margin:0}
  .sidebar.collapsed .region{gap:10px;padding:0}
  .sidebar.collapsed .card{padding:0;width:36px;height:36px;margin:0 auto;border-radius:11px;display:grid;place-items:center}
  .sidebar.collapsed .card .chead,.sidebar.collapsed .card .cbody,
  .sidebar.collapsed .card .cbtns,.sidebar.collapsed .card .tip{display:none}
  .sidebar.collapsed .card .hazard{position:absolute;left:0;right:0;bottom:0;height:4px;margin:0}
  .sidebar.collapsed .card .rail-dot{display:block;width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .sidebar.collapsed .card[data-state="armed"] .rail-dot,.sidebar.collapsed .card[data-state="idle"] .rail-dot{background:var(--amber);animation:pulse 1.8s infinite}
  .sidebar.collapsed .card[data-state="fire"] .rail-dot{background:var(--red);animation:pulse .9s infinite}
  .rail-dot{display:none}
  .sidebar.collapsed .other-plugin{padding:0;width:36px;height:32px;margin:0 auto;display:grid;place-items:center}
  .sidebar.collapsed .navrow.foot{justify-content:center}

  .other-plugin{flex:none;border:1px dashed var(--line);border-radius:12px;padding:9px 10px;margin-top:2px}
  .other-plugin .op-head{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .other-plugin .op-body{font-size:11px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden}

  /* ---------------- console ---------------- */
  .console{flex:1;min-width:0;max-width:470px}
  .console h1{font-size:14px;margin:2px 0 4px;font-weight:650}
  .console .sub{font-size:11.5px;color:var(--dim);margin-bottom:16px;line-height:1.7}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:12px}
  .box h2{font-size:10.5px;letter-spacing:.09em;color:var(--dim);margin:0 0 9px;font-weight:600;text-transform:uppercase}
  .seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:11.5px;padding:5px 11px;border-radius:7px;cursor:pointer}
  .seg button.on{background:var(--text);color:var(--panel)}
  .row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 0;font-size:12px;color:var(--muted)}
  .row b{color:var(--text);font-weight:550;font-size:12px}
  .switch{position:relative;width:36px;height:20px;border-radius:20px;background:var(--line);border:0;cursor:pointer;flex:none;transition:.18s}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.18s}
  .switch.on{background:var(--amber)}
  .switch.on::after{left:18px}
  .btns-row{display:flex;gap:8px;margin-top:6px}
  .actbtn{flex:1;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);
    font:inherit;font-size:12px;cursor:pointer}
  .actbtn:hover{filter:brightness(1.12)}
  .actbtn.amber{border-color:rgba(255,178,36,.45);color:var(--amber);background:rgba(255,178,36,.07)}
  .actbtn.red{border-color:rgba(255,77,79,.45);color:#ff9fa1;background:rgba(255,77,79,.07)}
  pre.state{margin:0;font-family:var(--mono);font-size:10.5px;line-height:1.7;color:var(--muted);white-space:pre-wrap;word-break:break-all}
  pre.state .k{color:var(--text)}
  pre.state .t{color:var(--amber)}
  pre.state .r{color:#ff9fa1}
  .log{font-family:var(--mono);font-size:10.5px;line-height:1.85;max-height:172px;overflow:auto}
  .log div{color:var(--muted);display:flex;gap:7px}
  .log div .tm{color:var(--dim);flex:none}
  .log div.hi{color:var(--text)}
  .log div.warn{color:#ffcf6b}
  .log div.err{color:#ff9fa1}
  .log .empty{color:var(--dim)}

  @keyframes slide{to{background-position:-34px 0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes blink{50%{opacity:0}}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,178,36,.65)}70%{box-shadow:0 0 0 6px rgba(255,178,36,0)}100%{box-shadow:0 0 0 0 rgba(255,178,36,0)}}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 1px rgba(255,77,79,.18),0 10px 30px -22px rgba(255,77,79,.7)}
    50%{box-shadow:0 0 0 2px rgba(255,77,79,.42),0 14px 40px -18px rgba(255,77,79,1)}}
  @keyframes sweep{0%{opacity:0;background-position:120% 0}12%{opacity:1}100%{opacity:0;background-position:-40% 0}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-.6px)}40%{transform:translateX(.7px)}60%{transform:translateX(-.4px)}80%{transform:translateX(.3px)}}
  .card.endgame .bigmain{display:inline-block;animation:shake .9s infinite}
</style>
</head>
<body data-theme="dark">

<div class="wrap">
  <div class="col-side">
    <div id="sideHost"></div>
    <div class="hint">点卡片里的按钮就是真实交互：武装 → 倒计时 → 取消 / 解除。<br>鼠标悬停卡片看判定条件与上次跳过原因。</div>
  </div>

  <div class="console">
    <h1>任务完成后关机 · 交互原型</h1>
    <div class="sub">这一版把状态机跑起来了：卡片按钮、右侧场景开关、倒计时、后台任务阻断、取消与解除，全部联动。下面的 JSON 就是插件 <code>/state</code> 会返回的内容。</div>

    <div class="box">
      <h2>外观（插件设置）</h2>
      <div class="seg" id="segVariant">
        <button data-v="A" class="on">A 警戒带</button><button data-v="B">B 雷达</button><button data-v="C">C 终端</button>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <div class="seg" id="segTheme"><button data-v="dark" class="on">深色</button><button data-v="light">浅色</button></div>
        <div class="seg" id="segCollapse"><button data-v="c">折叠侧边栏</button></div>
      </div>
    </div>

    <div class="box">
      <h2>场景模拟</h2>
      <div class="row"><span>有会话在运行（<b id="runVal">3</b> 个）</span><button class="switch on" id="swRun"></button></div>
      <div class="row"><span>有后台任务在跑（<b id="jobVal">2</b> 个）</span><button class="switch on" id="swJob"></button></div>
      <div class="btns-row">
        <button class="actbtn amber" id="btnFinish">模拟本轮任务全部结束</button>
        <button class="actbtn" id="btnReset">重置</button>
      </div>
    </div>

    <div class="box">
      <h2>/state</h2>
      <pre class="state" id="stateJson"></pre>
    </div>

    <div class="box">
      <h2>事件</h2>
      <div class="log" id="log"><div class="empty">— 点「武装」开始 —</div></div>
    </div>
  </div>
</div>

<script>
const ICON_CHAT = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h16v11H8l-4 4z"/></svg>';
const ICON_SKILL = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l2.2 5.3L20 10l-5.8 1.7L12 17l-2.2-5.3L4 10l5.8-1.7z"/></svg>';
const ICON_CLIP = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="7" y="5" width="10" height="14" rx="2"/><path d="M9 5V3h6v2"/></svg>';
const ICON_GEAR = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>';

const S = {
  armed: false, phase: 'waiting',   // waiting | countdown | fired
  sec: 60, variant: 'A', collapsed: false, theme: 'dark',
  running: 3, jobs: 2, lastSkip: null,
  log: []
};
let timer = null;

/* ---------- derived ---------- */
function view(){
  if (!S.armed) return 'off';
  if (S.phase === 'fired') return 'fired';
  if (S.phase === 'countdown') return 'fire';
  if (S.jobs > 0 || S.running > 0) return 'hold';
  return 'idle';
}
function mmss(s){ return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
function tagOf(v){ return v==='off'?'OFF':v==='fire'?'FIRE':v==='fired'?'DONE':v==='hold'?'HOLD':'ARMED'; }

/* ---------- log ---------- */
function stamp(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}
function log(text, kind){
  S.log.unshift({ t: stamp(), text, kind: kind||'' });
  if (S.log.length > 40) S.log.pop();
  renderLog();
}

/* ---------- actions ---------- */
function arm(){
  S.armed = true; S.phase = 'waiting'; S.sec = 60; S.lastSkip = null;
  log('已武装：所有任务结束后自动关机');
  if (S.jobs > 0 || S.running > 0){
    S.lastSkip = { at: Date.now(), reason: `还有 ${S.jobs} 个后台任务 / ${S.running} 个会话在运行，暂不关机` };
    log('暂不关机：' + S.lastSkip.reason, 'warn');
  } else {
    startCountdown('当前已空闲');
  }
  render();
}
function disarm(){
  stopTimer(); S.armed = false; S.phase = 'waiting'; S.sec = 60;
  log('已关闭自动关机');
  render();
}
function cancelCountdown(){
  stopTimer(); S.phase = 'waiting'; S.sec = 60;
  S.lastSkip = { at: Date.now(), reason: '用户取消了本次倒计时（模式保持开启）' };
  log('已取消本次倒计时，模式保持开启', 'warn');
  render();
}
function reset(){
  stopTimer(); S.armed=false; S.phase='waiting'; S.sec=60; S.lastSkip=null;
  log('已重置');
  render();
}

function startCountdown(why){
  S.phase = 'countdown'; S.sec = 60;
  log('所有任务已结束（' + why + '）→ 开始 60 秒倒计时', 'hi');
  stopTimer();
  timer = setInterval(() => {
    S.sec -= 1;
    if (S.sec <= 0){
      stopTimer();
      S.phase = 'fired'; S.sec = 0;
      log('关机指令已生效（演示环境不会真的关机）', 'err');
      render();
      return;
    }
    paintCountdown();
  }, 1000);
  paintCountdown();
}
function stopTimer(){ if (timer){ clearInterval(timer); timer = null; } }

/* ---------- external events (task finished / started) ---------- */
function setJobs(n){
  const prev = S.jobs; S.jobs = n;
  if (S.armed && S.phase === 'countdown' && n > 0){
    stopTimer(); S.phase = 'waiting'; S.sec = 60;
    log('倒计时中出现新的后台任务 → 已取消本次关机（保持武装）', 'warn');
  } else if (S.armed && S.phase === 'waiting' && n > 0){
    log('检测到 ' + n + ' 个后台任务，暂不关机', 'warn');
  } else if (S.armed && S.phase === 'waiting' && prev > 0 && n === 0 && S.running === 0){
    startCountdown('后台任务已结束');
  }
  render();
}
function setRunning(n){
  const prev = S.running; S.running = n;
  if (S.armed && S.phase === 'countdown' && n > 0){
    stopTimer(); S.phase = 'waiting'; S.sec = 60;
    log('倒计时中出现新的运行会话 → 已取消本次关机（保持武装）', 'warn');
  } else if (S.armed && S.phase === 'waiting' && n > 0){
    log('检测到 ' + n + ' 个会话在运行，暂不关机', 'warn');
  } else if (S.armed && S.phase === 'waiting' && prev > 0 && n === 0 && S.jobs === 0){
    startCountdown('会话已结束');
  }
  render();
}

/* ---------- paint ---------- */
function metaText(v){
  if (v === 'fire') return '<span class="warn">系统关机指令已下发</span>';
  if (v === 'fired') return '<span class="warn">指令已生效，无法取消</span>';
  if (v === 'hold') return '<span class="warn">' + (S.jobs>0 ? S.jobs+' 个后台任务' : S.running+' 个会话') + '运行中，暂不关机</span>';
  if (v === 'idle') return '<span>所有任务已结束 · 等待下一次触发</span>';
  return '<span>空闲会话 <b>'+S.running+'</b></span><span>运行中 <b>'+S.running+'</b></span><span>后台任务 <b>'+S.jobs+'</b></span>';
}
function bigHTML(v){
  if (v === 'fire') return '<span class="bigmain" data-count>'+mmss(S.sec)+'</span><small>后关机</small>';
  if (v === 'fired') return '<span class="bigmain">已关机</span><small>演示结束</small>';
  if (v === 'hold') return '等后台任务';
  if (v === 'idle') return '待命';
  return '<span class="bigmain">未开启</span>';
}
function btnsHTML(v){
  const gear = '<button class="btn ghost" data-act="gear" title="设置">'+ICON_GEAR+'</button>';
  if (v === 'fire') return '<button class="btn danger" data-act="cancel">取消关机</button>' + gear;
  if (v === 'fired') return '<button class="btn" data-act="reset">重置</button>' + gear;
  if (v === 'off') return '<button class="btn primary" data-act="arm">武装</button>' + gear;
  return '<button class="btn danger" data-act="disarm">解除</button>' + gear;
}
function vbHTML(v){
  if (v === 'fire') return '<span class="bigmain" data-count>'+mmss(S.sec)+'</span><small>T-minus</small>';
  if (v === 'fired') return 'Fired<small>done</small>';
  if (v === 'hold') return 'Holding<small>jobs '+S.jobs+'</small>';
  if (v === 'idle') return 'Standby';
  return 'Offline';
}
function vcHTML(v){
  if (v === 'fire') return '<div><span class="cl">$</span> shutdown --fire</div><div><span class="cl">&gt;</span> T-minus <span data-count>'+mmss(S.sec)+'</span></div><div><span class="cl">&gt;</span> ready<span class="cur"></span></div>';
  if (v === 'fired') return '<div><span class="cl">$</span> shutdown --fire</div><div><span class="cl">&gt;</span> executed</div><div><span class="cl">&gt;</span> bye<span class="cur"></span></div>';
  if (v === 'hold') return '<div><span class="cl">$</span> shutdown --when idle</div><div><span class="cl">&gt;</span> jobs '+S.jobs+' · running</div><div><span class="cl">&gt;</span> hold<span class="cur"></span></div>';
  if (v === 'idle') return '<div><span class="cl">$</span> shutdown --when idle</div><div><span class="cl">&gt;</span> roots 0 · running 0</div><div><span class="cl">&gt;</span> waiting<span class="cur"></span></div>';
  return '<div><span class="cl">$</span> shutdown --when idle</div><div><span class="cl">&gt;</span> disabled</div><div><span class="cl">&gt;</span> <span class="cur"></span></div>';
}
function cardHTML(){
  const v = view();
  const tip = S.lastSkip
    ? '<div><span class="k">上次跳过</span> '+S.lastSkip.reason+'</div>'
    : '<div><span class="k">上次跳过</span> —</div>';
  return `
  <div class="card" id="card" data-state="${v}" data-variant="${S.variant}">
    <div class="flash" id="flash"></div>
    <div class="tip">
      <div><span class="k">条件</span> 仅成功时关机 · 后台任务为 0 · 所有 root 会话空闲</div>
      ${tip}
      <div class="row2"><span class="k">当前</span> 运行中 ${S.running} · 后台任务 ${S.jobs}</div>
    </div>
    <div class="rail-dot"></div>
    <div class="chead"><span class="live"></span><span>任务完成后关机</span><span class="tag">${tagOf(v)}</span></div>
    <div class="cbody">
      <div class="v-a"><div class="big">${bigHTML(v)}</div><div class="meta">${metaText(v)}</div></div>
      <div class="v-b"><div class="disc"><div class="sweep"></div><div class="ring"></div><div class="ring b"></div><div class="ping"></div><div class="num">${vbHTML(v)}</div></div></div>
      <div class="v-c"><div class="screen">${vcHTML(v)}</div><div class="leds"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    </div>
    <div class="cbtns">${btnsHTML(v)}</div>
    <div class="hazard"></div>
  </div>`;
}
function sidebarHTML(){
  const armedCls = (S.armed ? ' armed' : '');
  const cls = 'sidebar' + (S.collapsed ? ' collapsed' : '') + armedCls;
  return `
  <div class="${cls}">
    <div class="brand"><span class="mark"></span><b>DeepSeek Harness</b></div>
    <div class="newbtn">＋ <span>新建会话</span><kbd>Ctrl N</kbd></div>
    <div class="navrow on">${ICON_CHAT}<span class="lbl">对话</span></div>
    <div class="navrow">${ICON_SKILL}<span class="lbl">技能中心</span><span class="armdot"></span></div>
    <div class="region">
      ${cardHTML()}
      <div class="other-plugin"><div class="op-head">${ICON_CLIP}<span>剪贴板历史</span></div><div class="op-body">8 条记录 · 刚刚同步</div></div>
      <div class="seclabel">会话</div>
      <div class="sess act"><i></i>重构关机插件</div>
      <div class="sess"><i></i>周报数据整理</div>
      <div class="sess"><i></i>README 校对</div>
      <div class="spacer"></div>
    </div>
    <div class="navrow foot">${ICON_GEAR}<span class="lbl">设置</span></div>
  </div>`;
}

function paintCountdown(){
  document.querySelectorAll('[data-count]').forEach(n => { n.textContent = mmss(Math.max(S.sec,0)); });
  const c = document.getElementById('card');
  if (c) c.classList.toggle('endgame', S.sec <= 10 && S.phase === 'countdown');
  paintState();
}
function render(){
  document.getElementById('sideHost').innerHTML = sidebarHTML();
  const f = document.getElementById('flash');
  if (f && S.armed && S.phase === 'waiting' && !(S.jobs>0||S.running>0)) {
    requestAnimationFrame(() => f.classList.add('play'));
  }
  const card = document.getElementById('card');
  if (card) card.classList.toggle('endgame', S.phase==='countdown' && S.sec<=10);
  document.getElementById('runVal').textContent = S.running;
  document.getElementById('jobVal').textContent = S.jobs;
  document.getElementById('swRun').classList.toggle('on', S.running>0);
  document.getElementById('swJob').classList.toggle('on', S.jobs>0);
  paintState();
}
function paintState(){
  const deadline = S.phase === 'countdown' ? Date.now() + S.sec*1000 : 0;
  const obj = {
    armed: S.armed, state: S.phase === 'countdown' ? 'countdown' : (S.phase==='fired' ? 'fired' : 'idle'),
    view: view(),
    deadline, countdownSec: 60, jobsRunning: S.jobs, running: S.running,
    lastSkip: S.lastSkip ? { at: S.lastSkip.at, reason: S.lastSkip.reason } : null
  };
  const html = JSON.stringify(obj, null, 2)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/"armed": (true|false)/, '"armed": <span class="t">$1</span>')
    .replace(/"state": "([a-z]+)"/, '"state": <span class="t">"$1"</span>')
    .replace(/"view": "([a-z]+)"/, '"view": <span class="t">"$1"</span>')
    .replace(/"deadline": (\d+)/, '"deadline": <span class="t">$1</span>')
    .replace(/"jobsRunning": (\d+)/, '"jobsRunning": <span class="t">$1</span>')
    .replace(/"running": (\d+)/, '"running": <span class="t">$1</span>');
  document.getElementById('stateJson').innerHTML = html;
}
function renderLog(){
  const el = document.getElementById('log');
  if (!S.log.length){ el.innerHTML = '<div class="empty">— 点「武装」开始 —</div>'; return; }
  el.innerHTML = S.log.map(e => `<div class="${e.kind}"><span class="tm">${e.t}</span><span>${e.text}</span></div>`).join('');
}

/* ---------- wire ---------- */
document.getElementById('sideHost').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act;
  if (a === 'arm') arm();
  if (a === 'disarm') disarm();
  if (a === 'cancel') cancelCountdown();
  if (a === 'reset') reset();
});
document.getElementById('segVariant').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.variant = b.dataset.v;
  document.querySelectorAll('#segVariant button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
document.getElementById('segTheme').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.theme = b.dataset.v;
  document.body.dataset.theme = S.theme;
  document.querySelectorAll('#segTheme button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
document.getElementById('segCollapse').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.collapsed = !S.collapsed;
  b.classList.toggle('on', S.collapsed);
  render();
});
document.getElementById('swRun').addEventListener('click', () => setRunning(S.running > 0 ? 0 : 3));
document.getElementById('swJob').addEventListener('click', () => setJobs(S.jobs > 0 ? 0 : 2));
document.getElementById('btnFinish').addEventListener('click', () => {
  S.running = 0; S.jobs = 0;
  document.getElementById('runVal').textContent = 0;
  document.getElementById('jobVal').textContent = 0;
  document.getElementById('swRun').classList.remove('on');
  document.getElementById('swJob').classList.remove('on');
  if (!S.armed){ log('任务已结束，但当前未武装', ''); render(); return; }
  if (S.phase === 'fired'){ log('上一轮已执行，请先重置', 'warn'); render(); return; }
  log('本轮任务全部结束', 'hi');
  startCountdown('任务全部结束');
  render();
});
document.getElementById('btnReset').addEventListener('click', reset);

/* ---------- demo presets via URL (for screenshots) ---------- */
(function init(){
  const p = new URLSearchParams(location.search);
  if (p.get('demo') === 'hold'){ S.armed = true; S.phase='waiting'; S.jobs=2; S.running=3; log('已武装：所有任务结束后自动关机'); log('暂不关机：还有 2 个后台任务 / 3 个会话在运行','warn'); log('检测到 2 个后台任务，暂不关机','warn'); }
  if (p.get('demo') === 'fire'){ S.armed = true; S.phase='countdown'; S.sec=8; S.jobs=0; S.running=0; log('已武装：所有任务结束后自动关机'); log('所有任务已结束（任务全部结束）→ 开始 60 秒倒计时','hi'); }
  if (p.get('demo') === 'fired'){ S.armed = true; S.phase='fired'; S.sec=0; S.jobs=0; S.running=0; log('关机指令已生效（演示环境不会真的关机）','err'); }
  render();
  if (p.get('tip') === '1'){
    const c = document.getElementById('card');
    if (c) c.classList.add('tipOn');
  }
})();
</script>
</body>
</html>
