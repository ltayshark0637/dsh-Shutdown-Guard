<!doctype html>
<html><head><meta charset="utf-8"><style>
  :root{--dsw-alias-bg-layer-2:#1e1e1d;--dsw-alias-label-primary:#f4f4f5;--dsw-alias-label-secondary:#b0aea5;
    --dsw-alias-border-l3:rgba(255,255,255,.12);--dsw-alias-button-primary-fill:#f5a623;--dsw-alias-label-inverse:#201500;
    --dsw-alias-state-error-primary:#ff4d4f;--dsw-font-family:Inter,system-ui}
  body{margin:0;background:#141413;font-family:Inter,system-ui;display:flex;gap:28px;padding:28px}
  .side{width:280px;background:#171716;border-radius:14px;padding:6px 12px;display:flex;flex-direction:column;gap:2px}
  .row{display:flex;align-items:center;gap:8px;height:36px;margin:0 2px;padding:7px 8px;border-radius:8px;color:#d8d6cd;font-size:13px}
  .row .ic{width:16px;height:16px;border-radius:4px;background:#3a3a37}
  .lab{font-size:11px;color:#8f8d85;padding:8px 2px 4px}
  .cap{font-size:11px;color:#8f8d85;margin-top:6px}
  .light{--dsw-alias-bg-layer-2:#fff;--dsw-alias-label-primary:#1b2030;--dsw-alias-label-secondary:#55617a;
    --dsw-alias-border-l3:rgba(0,0,0,.12);background:#f3f6fa;color:#1b2030}
  .light .side{background:#fbfcfe}
</style><style>.dsp-host{flex:0 0 auto;padding:0 12px 8px 0;min-width:0}.dsp-card{--dsp-bg:#1c1e22;--dsp-fg:#f3f4f6;--dsp-muted:#a7abb4;--dsp-line:rgba(255,255,255,.14);--dsp-accent:#f0a83a;--dsp-danger:#ef5350;--dsp-track:rgba(255,255,255,.16);--dsp-tape-a:#f2b13c;--dsp-tape-b:#e8453c}.dsp-card[data-lum="light"]{--dsp-bg:#ffffff;--dsp-fg:#1b2030;--dsp-muted:#5b6472;--dsp-line:rgba(0,0,0,.15);--dsp-accent:#e08f13;--dsp-danger:#d92d20;--dsp-track:rgba(0,0,0,.13);--dsp-tape-a:#f0b03a;--dsp-tape-b:#e0483c}.dsp-card{position:relative;box-sizing:border-box;width:100%;margin:0;padding:10px 8px 0;border-radius:12px;border:1px solid var(--dsp-line);background:var(--dsp-bg);color:var(--dsp-fg);font-family:var(--dsw-font-family, system-ui);overflow:hidden;transition:height .18s ease}.dsp-card[data-state="off"]{background:color-mix(in srgb, var(--dsp-fg) 2.5%, var(--dsp-bg))}.dsp-card[data-state="fire"]{border-color:var(--dsp-danger)}.dsp-card.is-folded{padding-bottom:10px}.dsp-chead{display:flex;align-items:center;gap:7px;height:22px;cursor:pointer;user-select:none}.dsp-live{width:6px;height:6px;border-radius:50%;flex:0 0 auto;background:var(--dsp-muted)}.dsp-card[data-state="armed"] .dsp-live,.dsp-card[data-state="hold"] .dsp-live{background:var(--dsp-accent);box-shadow:0 0 8px var(--dsp-accent)}.dsp-card[data-state="fire"] .dsp-live,.dsp-card[data-state="fired"] .dsp-live{background:var(--dsp-danger);animation:dsp-pulse-red .9s infinite}.dsp-ctitle{flex:1 1 auto;min-width:0;font-size:11.5px;line-height:16px;color:var(--dsp-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dsp-tag{flex:0 0 auto;font-family:ui-monospace, "Cascadia Mono", Consolas, monospace;font-size:9px;letter-spacing:.08em;padding:1px 5px;border-radius:5px;border:1px solid color-mix(in srgb, var(--dsp-muted) 40%, transparent);color:var(--dsp-muted)}.dsp-card[data-state="armed"] .dsp-tag,.dsp-card[data-state="hold"] .dsp-tag{color:var(--dsp-accent);border-color:color-mix(in srgb, var(--dsp-accent) 50%, transparent)}.dsp-card[data-state="fire"] .dsp-tag,.dsp-card[data-state="fired"] .dsp-tag{color:var(--dsp-danger);border-color:color-mix(in srgb, var(--dsp-danger) 50%, transparent)}.dsp-chev{flex:0 0 auto;color:var(--dsp-muted);transition:transform .18s}.dsp-chev.is-folded{transform:rotate(-90deg)}.dsp-cbody{position:relative}.dsp-v-a{padding:6px 0 0}.dsp-big{font-family:ui-monospace, "Cascadia Mono", Consolas, "Microsoft YaHei", monospace;font-size:25px;line-height:1.15;font-weight:650;letter-spacing:-.5px}.dsp-card[data-state="fire"] .dsp-big{color:var(--dsp-danger)}.dsp-meta{margin-top:4px;font-size:10.5px;line-height:15px;color:var(--dsp-muted);min-height:15px}.dsp-card[data-state="hold"] .dsp-meta{color:var(--dsp-accent)}.dsp-cbtns{display:flex;align-items:center;gap:8px;padding:7px 0 10px}.dsp-btn{flex:1 1 auto;height:26px;border-radius:7px;border:1px solid var(--dsp-line);background:transparent;color:inherit;font:inherit;font-size:11.5px;cursor:pointer}.dsp-btn:hover{background:color-mix(in srgb, var(--dsp-fg) 7%, transparent)}.dsp-btn-primary{border-color:transparent;background:var(--dsp-accent);color:#1a1200;font-weight:600}.dsp-btn-danger{border-color:color-mix(in srgb, var(--dsp-danger) 45%, transparent);color:var(--dsp-danger);background:color-mix(in srgb, var(--dsp-danger) 6%, transparent)}.dsp-note{flex:0 0 auto;font-size:10px;color:var(--dsp-muted)}.dsp-hazard{position:relative;height:10px;margin:0 -8px;overflow:hidden}.dsp-hazard::before{content:"";position:absolute;top:0;bottom:0;left:-48px;right:-48px;background:repeating-linear-gradient(115deg,var(--dsp-tape-a) 0 10px,var(--dsp-tape-b) 10px 20px);animation:dsp-slide 1.15s linear infinite}.dsp-card[data-state="hold"] .dsp-hazard::before{animation-duration:2.6s;opacity:.9}.dsp-card[data-state="fire"] .dsp-hazard::before{animation-duration:.42s}.dsp-card[data-state="off"] .dsp-hazard{opacity:.55}.dsp-card[data-state="off"] .dsp-hazard::before{animation:none}.dsp-card[data-state="fired"] .dsp-hazard{opacity:.45}.dsp-card[data-state="fired"] .dsp-hazard::before{animation:none}.dsp-v-b{display:flex;align-items:center;gap:10px;padding:8px 0 2px}.dsp-disc{position:relative;flex:0 0 96px;width:96px;height:96px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--dsp-accent) 26%, transparent), transparent 70%)}.dsp-sweep{position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;filter:blur(4px);background:conic-gradient(from 0deg, transparent 0deg 288deg, color-mix(in srgb, var(--dsp-accent) 10%, transparent) 316deg, color-mix(in srgb, var(--dsp-accent) 30%, transparent) 344deg, color-mix(in srgb, var(--dsp-accent) 60%, transparent) 359deg, transparent 360deg);animation:dsp-spin 5.2s linear infinite}.dsp-rings{position:absolute;inset:0}.dsp-dots{position:absolute;inset:0}.dsp-ring{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);border:1px solid color-mix(in srgb, var(--dsp-accent) 40%, transparent)}.dsp-ping{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:var(--dsp-accent);box-shadow:0 0 8px var(--dsp-accent)}.dsp-rdot{position:absolute;width:4.5px;height:4.5px;border-radius:50%;transform:translate(-50%,-50%)}.dsp-rdot-run{background:var(--dsp-muted)}.dsp-rdot-job{background:var(--dsp-accent)}.dsp-card[data-state="hold"] .dsp-rdot{animation:dsp-dotpulse 2.4s ease-in-out infinite}.dsp-card[data-state="fire"] .dsp-rdot{opacity:.3}.dsp-stats{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:7px}.dsp-stat{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.dsp-k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dsp-muted)}.dsp-v{font-family:ui-monospace, "Cascadia Mono", Consolas, monospace;font-size:18px;line-height:1;font-weight:650;color:var(--dsp-fg);font-variant-numeric:tabular-nums}.dsp-stat-state{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dsp-muted);margin-top:1px}.dsp-card[data-state="hold"] .dsp-stat-state{color:var(--dsp-accent)}.dsp-card[data-state="fire"] .dsp-stat-state{color:var(--dsp-danger)}.dsp-v-c{padding:6px 0 0}.dsp-screen{border-radius:6px;padding:6px 7px;background:#0b0d10;border:1px solid rgba(255,255,255,.08);font-family:ui-monospace, "Cascadia Mono", Consolas, monospace;font-size:9.5px;line-height:1.5;color:#9ef0a8;min-height:58px}.dsp-term-line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c9f7d2}.dsp-pr{color:#5d8f6b;margin-right:4px}.dsp-caret{display:inline-block;width:5px;height:9px;margin-left:2px;background:#9ef0a8;animation:dsp-blink 1s steps(1) infinite;vertical-align:-1px}.dsp-card[data-state="fire"] .dsp-screen{background:#2a0d0d;border-color:rgba(255,77,79,.4);color:#ffb3b0}.dsp-card[data-state="fire"] .dsp-term-line{color:#ffd0cc}.dsp-card[data-state="fire"] .dsp-caret{background:#ff4d4f}.dsp-led{display:flex;gap:4px;margin-top:6px}.dsp-led-seg{flex:1 1 0;height:3px;border-radius:2px;background:var(--dsp-track)}.dsp-led-seg.on{background:var(--dsp-accent)}.dsp-card[data-state="fire"] .dsp-led-seg.on{background:var(--dsp-danger)}.dsp-code{margin-top:5px;font-size:9px;color:var(--dsp-muted)}.dsp-settings{display:flex;flex-direction:column;gap:10px;font-size:12px;color:var(--dsw-alias-label-primary, #f4f4f5)}.dsp-srow{display:flex;align-items:center;justify-content:space-between;gap:12px}.dsp-seg{display:flex;gap:4px;padding:2px;border-radius:8px;background:color-mix(in srgb, var(--dsw-alias-label-primary, #fff) 5%, transparent)}.dsp-segbtn{border:none;background:transparent;color:inherit;font:inherit;font-size:11px;padding:3px 8px;border-radius:6px;cursor:pointer;opacity:.7}.dsp-segbtn.on{background:var(--dsw-alias-bg-layer-2, #2a2a28);opacity:1}.dsp-switch{width:32px;height:18px;border-radius:9px;border:1px solid var(--dsw-alias-border-l3, rgba(128,128,128,.3));background:transparent;position:relative;cursor:pointer;padding:0}.dsp-switch i{position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--dsw-alias-label-secondary, #9a9a96);transition:.16s}.dsp-switch.on{background:var(--dsw-alias-button-primary-fill, #f5a623);border-color:transparent}.dsp-switch.on i{left:16px;background:var(--dsw-alias-label-inverse, #201500)}.dsp-shint{font-size:11px;line-height:1.65;color:var(--dsw-alias-label-secondary, #9a9a96)}@keyframes dsp-slide{to{transform:translateX(-22.07px)}}@keyframes dsp-spin{to{transform:rotate(360deg)}}@keyframes dsp-blink{50%{opacity:0}}@keyframes dsp-dotpulse{0%,100%{opacity:1}50%{opacity:.35}}@keyframes dsp-pulse-red{0%{box-shadow:0 0 0 0 rgba(239,83,80,.7)}70%{box-shadow:0 0 0 6px rgba(239,83,80,0)}100%{box-shadow:0 0 0 0 rgba(239,83,80,0)}}</style></head>
<body>
  <div class="wrap"><div class="side">
    <div class="row"><span class="ic"></span>工作台</div>
    <div class="row"><span class="ic"></span>插件</div>
    <div class="row"><span class="ic"></span>技能中心</div>
    <div class="dsp-host"><div class="dsp-card" data-state="armed" data-variant="A">
      <div class="dsp-chead"><i class="dsp-live"></i><span class="dsp-ctitle">任务完成后关机</span><span class="dsp-tag">ARMED</span>
      <svg class="dsp-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
      <div class="dsp-cbody dsp-v-a"><div class="dsp-big">待命</div><div class="dsp-meta">所有任务已结束 · 等待下一次触发</div></div>
      <div class="dsp-cbtns"><button class="dsp-btn dsp-btn-danger">解除</button><span class="dsp-note">守候中</span></div>
      <div class="dsp-hazard"></div>
    </div></div>
    <div class="lab">会话</div>
    <div class="row"><span class="ic"></span>重构关机插件</div>
    <div class="row"><span class="ic"></span>周报数据整理</div>
  </div><div class="cap">A · armed（深色）</div></div>

  <div class="wrap"><div class="side">
    <div class="row"><span class="ic"></span>工作台</div>
    <div class="row"><span class="ic"></span>技能中心</div>
    <div class="dsp-host"><div class="dsp-card" data-state="fire" data-variant="A">
      <div class="dsp-chead"><i class="dsp-live"></i><span class="dsp-ctitle">任务完成后关机</span><span class="dsp-tag">FIRE</span>
      <svg class="dsp-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
      <div class="dsp-cbody dsp-v-a"><div class="dsp-big">00:42</div><div class="dsp-meta">系统关机指令已下发</div></div>
      <div class="dsp-cbtns"><button class="dsp-btn dsp-btn-danger">取消关机</button><span class="dsp-note">点取消可撤销本次</span></div>
      <div class="dsp-hazard"></div>
    </div></div>
    <div class="lab">会话</div>
    <div class="row"><span class="ic"></span>重构关机插件</div>
  </div><div class="cap">A · fire</div></div>

  <div class="wrap light"><div class="side">
    <div class="row"><span class="ic"></span>工作台</div>
    <div class="row"><span class="ic"></span>技能中心</div>
    <div class="dsp-host"><div class="dsp-card" data-state="off" data-variant="A" data-lum="light">
      <div class="dsp-chead"><i class="dsp-live"></i><span class="dsp-ctitle">任务完成后关机</span><span class="dsp-tag">OFF</span>
      <svg class="dsp-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
      <div class="dsp-cbody dsp-v-a"><div class="dsp-big">未开启</div><div class="dsp-meta">仅在点击「武装」后才会运行程序</div></div>
      <div class="dsp-cbtns"><button class="dsp-btn dsp-btn-primary">武装</button><span class="dsp-note"></span></div>
      <div class="dsp-hazard"></div>
    </div></div>
    <div class="lab">会话</div>
    <div class="row"><span class="ic"></span>重构关机插件</div>
  </div><div class="cap">A · off（浅色）</div></div>
  <div class="wrap"><div class="side">
    <div class="row"><span class="ic"></span>工作台</div>
    <div class="row"><span class="ic"></span>技能中心</div>
    <div class="dsp-host"><div class="dsp-card" data-state="hold" data-variant="B">
      <div class="dsp-chead"><i class="dsp-live"></i><span class="dsp-ctitle">任务完成后关机</span><span class="dsp-tag">WAIT</span>
      <svg class="dsp-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
      <div class="dsp-cbody dsp-v-b"><div class="dsp-disc">
        <div class="dsp-sweep"></div>
        <div class="dsp-rings"><i class="dsp-ring" style="width:26px;height:26px;opacity:0.550"></i><i class="dsp-ring" style="width:34px;height:34px;opacity:0.505"></i><i class="dsp-ring" style="width:42px;height:42px;opacity:0.460"></i><i class="dsp-ring" style="width:50px;height:50px;opacity:0.415"></i><i class="dsp-ring" style="width:58px;height:58px;opacity:0.370"></i><i class="dsp-ring" style="width:66px;height:66px;opacity:0.325"></i><i class="dsp-ring" style="width:74px;height:74px;opacity:0.280"></i><i class="dsp-ring" style="width:82px;height:82px;opacity:0.235"></i><i class="dsp-ring" style="width:90px;height:90px;opacity:0.190"></i></div>
        <div class="dsp-ping"></div>
        <div class="dsp-dots"><i class="dsp-rdot dsp-rdot-job" style="left:calc(50% + -38px);top:calc(50% + -14px)"></i><i class="dsp-rdot dsp-rdot-job" style="left:calc(50% + -14px);top:calc(50% + 22px)"></i><i class="dsp-rdot dsp-rdot-job" style="left:calc(50% + 8px);top:calc(50% + -30px)"></i><i class="dsp-rdot dsp-rdot-job" style="left:calc(50% + 24px);top:calc(50% + 10px)"></i><i class="dsp-rdot dsp-rdot-job" style="left:calc(50% + 36px);top:calc(50% + 28px)"></i><i class="dsp-rdot dsp-rdot-job" style="left:calc(50% + 2px);top:calc(50% + 4px)"></i></div>
      </div><div class="dsp-stats"><div class="dsp-stat"><span class="dsp-k">agent</span><b class="dsp-v">3</b></div><div class="dsp-stat"><span class="dsp-k">jobs</span><b class="dsp-v">2</b></div><div class="dsp-stat-state">Holding</div></div></div>
      <div class="dsp-cbtns"><button class="dsp-btn dsp-btn-danger">解除</button><span class="dsp-note">等任务结束</span></div>
      <div class="dsp-hazard"></div>
    </div></div>
    <div class="lab">会话</div>
    <div class="row"><span class="ic"></span>重构关机插件</div>
  </div><div class="cap">B · hold（深色）</div></div></body></html>
